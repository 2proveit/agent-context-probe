name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-artifacts:
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check
      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish
      - name: Verify checksums and archive contents
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c agent-context-probe_checksums.txt)
          for archive in dist/*.tar.gz; do
            if tar -tzf "$archive" | grep -Eq '(^|/)(config\.yaml|\.env|requests\.db)$|(^|/)exports/'; then
              echo "Sensitive runtime file found in $archive" >&2
              exit 1
            fi
          done
          for archive in dist/*.zip; do
            if unzip -Z1 "$archive" | grep -Eq '(^|/)(config\.yaml|\.env|requests\.db)$|(^|/)exports/'; then
              echo "Sensitive runtime file found in $archive" >&2
              exit 1
            fi
          done
      - name: Upload verified artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  lifecycle-linux:
    name: Lifecycle test (Linux without toolchain)
    needs: verify-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out lifecycle scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-dist
          path: dist
      - name: Test install, start, upgrade, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -type f -name 'agent-context-probe_*_linux_x86_64.tar.gz' -print -quit)
          test -n "$archive"
          docker run --rm \
            --network none \
            -v "$PWD:/workspace:ro" \
            alpine:3.21 \
            sh /workspace/scripts/test-release-lifecycle.sh "/workspace/$archive"

  lifecycle-macos:
    name: Lifecycle test (macOS without toolchain in PATH)
    needs: verify-artifacts
    runs-on: macos-14
    steps:
      - name: Check out lifecycle scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-dist
          path: dist
      - name: Test install, start, upgrade, and uninstall
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) archive_arch=arm64 ;;
            *) archive_arch=x86_64 ;;
          esac
          archive=$(find dist -maxdepth 1 -type f -name "agent-context-probe_*_darwin_${archive_arch}.tar.gz" -print -quit)
          test -n "$archive"
          sh scripts/test-release-lifecycle.sh "$archive"

  lifecycle-windows:
    name: Lifecycle test (Windows without toolchain in PATH)
    needs: verify-artifacts
    runs-on: windows-2025
    steps:
      - name: Check out lifecycle scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-dist
          path: dist
      - name: Test install, start, upgrade, and uninstall
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter "agent-context-probe_*_windows_x86_64.zip" | Select-Object -First 1
          if (-not $archive) { throw "Windows release archive was not found" }
          & scripts/test-release-lifecycle.ps1 -ArchivePath $archive.FullName

  publish-release:
    name: Publish GitHub Release
    needs:
      - lifecycle-linux
      - lifecycle-macos
      - lifecycle-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Publish release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
            dist/*.sbom.json

  publish-image:
    name: Publish GHCR image
    needs:
      - lifecycle-linux
      - lifecycle-macos
      - lifecycle-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Derive build metadata
        id: build-metadata
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Generate image metadata
        id: image-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push multi-platform image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-metadata.outputs.version }}
            GIT_COMMIT=${{ steps.build-metadata.outputs.commit }}
            BUILD_TIME=${{ steps.build-metadata.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
